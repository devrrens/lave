# Reverse proxy untuk Barokah Jaya Fashion (contoh production).
# Jalankan Next.js di :3000 (docker compose service `app`), Nginx di :80.
#
#   docker compose up -d --build
#   # + service nginx dgn volume ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
#     dan ports 80:80 (lihat komentar di docker-compose.yml)

events {}

http {
  upstream app {
    server app:3000;
  }

  server {
    listen 80;
    server_name _;

    # Uploads max 5MB (app) + margin multipart
    client_max_body_size 6m;

    # Cache bawaan Next untuk aset statis
    location /_next/static/ {
      proxy_pass http://app;
      proxy_cache_valid 200 7d;
      add_header Cache-Control "public, max-age=604800, immutable";
    }

    location / {
      proxy_pass http://app;
      proxy_http_version 1.1;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
}
